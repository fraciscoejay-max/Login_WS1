<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/register/style.css">
</head>
<body>
    <div class="registerpage">
        <h1>REGISTER</h1>
        <form>
            <div class="fullname">
                <label>Fullname(Surname, Name, MI.)</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter fullname" required>
            </div>

            <div class="username">
                <label>Username</label><br>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="password">
                <label>Enter Password</label><br>
                <input type="password" id="enter" name="password" placeholder="Enter your password" required><br>
                <label>Re-enter Password</label><br>
                <input type="password" id="re enter" name="re enter password" placeholder="Re enter your password" required>
            </div>
               
            <div class="email">
                <label>Email</label><br>
                <input type="email" id="email" name="email" placeholder="Enter email">
            </div>

                <button class="button" type="submit">Register</button>

            <div class="footer">
                <p>Have an Account?<a href="#">Sign in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
